name: Publish Blog Post

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: 'Select the draft to publish'
        required: true
        type: choice
        options:
          # Placeholder entry; publishable drafts are appended below this line by the agent.
          - "placeholder-use-this-if-sync-only.md"
          - "are-you-yak-shaving-with-ai.md"
          - "ai-the-next-printing-press-of-knowledge-transfer.md"
          - "vanilla-os-2-impressions.md"
      run_mode:
        description: 'Select steps to execute'
        required: true
        type: choice
        default: 'both'
        options:
          - 'publish_only'
          - 'sync_to_public_only'
          - 'both'

jobs:
  publish_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Publish (Move & Format)
        if: ${{ github.event.inputs.run_mode == 'publish_only' || github.event.inputs.run_mode == 'both' }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x .github/scripts/publish.sh
          .github/scripts/publish.sh "${{ github.event.inputs.file_name }}"

      - name: Run Sync to Public
        if: ${{ github.event.inputs.run_mode == 'sync_to_public_only' || github.event.inputs.run_mode == 'both' }}
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          chmod +x .github/scripts/sync_to_public.sh
          .github/scripts/sync_to_public.sh

      - name: Wait 1.5 minutes for GitHub Pages to deploy
        if: ${{ github.event.inputs.run_mode == 'sync_to_public_only' || github.event.inputs.run_mode == 'both' }}
        env:
          DEPLOYMENT_WAIT_SECONDS: "90"
        run: sleep "$DEPLOYMENT_WAIT_SECONDS"

      - name: Verify published site contains expected commit hash
        if: ${{ github.event.inputs.run_mode == 'sync_to_public_only' || github.event.inputs.run_mode == 'both' }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          SITE_URL: "https://shinglyu.com"
        run: |
          echo "Checking for commit $COMMIT_SHA on $SITE_URL"
          BODY=$(curl -s --max-time 30 --retry 3 "$SITE_URL")
          if echo "$BODY" | grep -q "git-commit: $COMMIT_SHA"; then
            echo "Commit $COMMIT_SHA found in live site. Deployment verified!"
          else
            echo "Commit $COMMIT_SHA not found in live site HTML."
            echo "The site may not have deployed yet or the build revision is not embedded."
            exit 1
          fi
